[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.30"
optimizer = true
optimizer_runs = 200
via_ir = false
network = "tempo"
fs_permissions = [{ access = "read-write", path = "./deployments" }]
remappings = [
  "forge-std/=lib/forge-std/src/",
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "tempo-std/=lib/tempo-std/src/",
]

[rpc_endpoints]
moderato = "https://rpc.moderato.tempo.xyz"

[lint]
lint_on_build = false
